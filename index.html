    // -------------------------------------------------------------
    // 3. 날짜 계산 유틸리티
    // -------------------------------------------------------------
    function getWeekDates(baseDate) {
      const current = new Date(baseDate);
      const day = current.getDay();
      // 이번 주 월요일 구하기
      const diffToMonday = current.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(current.setDate(diffToMonday));

      const week = {};
      for (let i = 1; i <= 5; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + (i - 1));
        week[i] = d;
      }
      return week;
    }

    const currentWeekDays = getWeekDates(currentDate);

    function formatDateFull(d) {
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      return `${month}월 ${date}일 (${dayNames[d.getDay()]})`;
    }

      const dayLabels = { 1: '월', 2: '화', 3: '수', 4: '목', 5: '금' };
      const realTodayDay = new Date().getDay();

      for (let i = 1; i <= 5; i++) {
        const targetDate = currentWeekDays[i];
        const isSelected = (i === selectedWeekday);
        const isRealToday = (i === realTodayDay);

        const tabBtn = document.createElement('button');
        tabBtn.onclick = () => selectWeekday(i);
        tabBtn.className = `flex flex-col items-center justify-center py-2 px-1 rounded-xl transition-all ${
          isSelected 
            ? 'bg-amber-500 text-white font-bold shadow-md shadow-amber-300 scale-[1.02]' 
            : 'bg-slate-50 text-slate-600 hover:bg-amber-100/50'
        }`;

        tabBtn.innerHTML = `
          <div class="flex items-center gap-1">
            <span class="text-xs ${isSelected ? 'text-amber-100' : 'text-slate-400'}">${dayLabels[i]}</span>
            ${isRealToday ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-rose-500'}"></span>` : ''}
          </div>
          <span class="text-sm font-extrabold mt-0.5">${targetDate.getDate()}</span>
        `;
        container.appendChild(tabBtn);
      }
    }

    function selectWeekday(dayIdx) {
      selectedWeekday = dayIdx;
      renderWeekdayTabs();
      renderScheduleForDay(dayIdx);
    }

    function goToToday() {
      const today = new Date().getDay();
      if (today >= 1 && today <= 5) {
        selectWeekday(today);
      } else {
        selectWeekday(1);
      }
      showToast('오늘 요일 스케줄로 이동했습니다.');
    }

    // -------------------------------------------------------------
    // 5. 스케줄 리스트 렌더링
    // -------------------------------------------------------------
    function renderScheduleForDay(dayIdx) {
      const schedule = WEEK_SCHEDULE[dayIdx];
      const targetDate = currentWeekDays[dayIdx];

      // 요일 헤더 카드 업데이트
      const badgeDay = document.getElementById('badge-day-label');
      const badgeDate = document.getElementById('badge-date-string');
      const routeTitle = document.getElementById('day-route-title');
      const countEl = document.getElementById('day-target-count');
      const summaryCard = document.getElementById('day-summary-card');

      badgeDay.textContent = schedule.dayName;
      badgeDate.textContent = `${targetDate.getMonth() + 1}월 ${targetDate.getDate()}일`;
      routeTitle.innerHTML = schedule.routeTitle;
      
      // 방문 인원수 계산 (break 제외)
      const eldersCount = schedule.items.filter(it => !it.type).length;
      countEl.textContent = `${eldersCount}명`;

      // 리스트 컨테이너
      const listContainer = document.getElementById('schedule-list');
      listContainer.innerHTML = '';

      schedule.items.forEach(item => {
        if (item.type === 'break') {
          // 휴식 및 점심 카드
          const breakEl = document.createElement('div');
          breakEl.className = 'bg-amber-100/60 border border-dashed border-amber-300 rounded-2xl p-3.5 flex items-center justify-between text-amber-900';
          breakEl.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-amber-200/80 flex items-center justify-center text-amber-700">
                <i class="fa-solid fa-mug-hot"></i>
              </div>
              <div>
                <h4 class="font-bold text-sm text-slate-800">${item.name}</h4>
                <p class="text-xs text-amber-800 font-medium">${item.location}</p>
              </div>
            </div>
            <span class="text-xs font-bold bg-white/70 px-2.5 py-1 rounded-full text-amber-800 shadow-sm">${item.time}</span>
          `;
          listContainer.appendChild(breakEl);
        } else {
          // 어르신 방문 카드
          const isExpanded = (expandedCardId === item.id);
          const savedNote = memoryNotes[item.elderId] || '';
          
          const cardEl = document.createElement('div');
          cardEl.id = `card-${item.id}`;
          cardEl.className = `bg-white rounded-2xl border transition-all duration-200 shadow-sm overflow-hidden ${
            isExpanded ? 'border-amber-400 ring-2 ring-amber-100 shadow-md' : 'border-slate-100 hover:border-amber-200'
          }`;

          cardEl.innerHTML = `
            <!-- 카드 헤더 (터치 시 토글) -->
            <div onclick="toggleCard('${item.id}')" class="p-4 cursor-pointer flex items-start justify-between gap-3 active:bg-amber-50/40">
              <div class="flex-1">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <span class="text-xs font-bold px-2 py-0.5 rounded-full ${item.badgeColor || 'bg-amber-100 text-amber-800'}">
                    ${item.tag}
                  </span>
                  <span class="text-xs font-bold text-slate-500">
                    <i class="fa-regular fa-clock mr-1 text-slate-400"></i>${item.time}
                  </span>
                  ${savedNote ? `<span class="text-[11px] font-semibold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full flex items-center gap-1"><i class="fa-solid fa-note-sticky text-emerald-500"></i>전달사항 있음</span>` : ''}
                </div>
                
                <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
                  ${item.name}
                  <span class="text-xs text-amber-600 font-normal">
                    <i class="fa-solid fa-hand-pointer mr-0.5"></i>터치하여 케어내용 확인
                  </span>
                </h3>
                
                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                  <i class="fa-solid fa-location-dot text-rose-500"></i>
                  ${item.location}
                </p>
              </div>

              <button class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 mt-1 transition-transform ${isExpanded ? 'rotate-180 bg-amber-100 text-amber-700' : ''}">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </button>
            </div>

            <!-- 상세 확장 영역 (체크리스트 & 다음 방문 메모) -->
            <div id="content-${item.id}" class="expand-content ${isExpanded ? 'block' : 'hidden'} border-t border-slate-100 bg-slate-50/60 p-4">
              
              <!-- 1. 이전 방문 시 적어둔 중요 전달사항 (있을 때 강조 노출) -->
              ${savedNote ? `
                <div class="mb-4 bg-emerald-50 border border-emerald-200 rounded-xl p-3 shadow-xs">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                      <i class="fa-solid fa-bell text-emerald-600"></i> 지난번 저장한 [다음에 꼭 해드릴 일]
                    </span>
                    <span class="text-[11px] text-emerald-600">체크 확인</span>
                  </div>
                  <div class="text-sm font-semibold text-slate-800 bg-white p-2.5 rounded-lg border border-emerald-100">
                    ${escapeHtml(savedNote)}
                  </div>
                </div>
              ` : ''}

              <!-- 2. 오늘 방문 시 해드릴 기본 케어 목록 (체크박스) -->
              <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-check text-amber-500"></i> 오늘 해드릴 케어 목록
                  </span>
                  <span class="text-[11px] text-slate-400">완료 시 체크</span>
                </div>

                <div class="space-y-2">
                  ${item.defaultChecks.map((task, idx) => {
                    const checkKey = `${item.elderId}_task_${idx}`;
                    const isChecked = !!memoryCheckedBoxes[checkKey];
                    return `
                      <label class="flex items-start gap-2.5 p-2 rounded-xl bg-white border border-slate-200/80 hover:border-amber-300 transition-colors cursor-pointer select-none">
                        <input type="checkbox" 
                               onchange="toggleTaskCheck('${checkKey}')"
                               ${isChecked ? 'checked' : ''} 
                               class="w-4 h-4 mt-0.5 rounded border-slate-300 text-amber-500 focus:ring-amber-400">
                        <span class="text-xs font-medium ${isChecked ? 'line-through text-slate-400' : 'text-slate-700'} leading-relaxed">
                          ${task}
                        </span>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- 3. 방문 후: 다음에 해드릴 것 적는 칸 & 저장 버튼 -->
              <div class="bg-white rounded-xl p-3 border border-slate-200/80 shadow-xs">
                <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5">
                  <i class="fa-solid fa-pen-to-square text-rose-500"></i>
                  방문 후 기록: 다음에 꼭 해드릴 것
                </label>
                <p class="text-[11px] text-slate-400 mb-2">
                  어르신과 대화 중 필요한 요청, 다음 주 챙길 물품 등을 메모해두면 다음에 열었을 때 상단에 표시됩니다.
                </p>
                <div class="flex flex-col gap-2">
                  <textarea id="note-input-${item.elderId}" 
                            rows="2" 
                            placeholder="예: 다음 방문 시 관절 파스 챙겨드리기, 둘째 아드님 통화 여부 여쭙기 등"
                            class="w-full text-xs p-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800 resize-none bg-slate-50/50">${savedNote}</textarea>
                  <div class="flex justify-end">
                    <button onclick="saveElderNote('${item.elderId}', '${item.id}')" 
                            class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-sm active:scale-95 transition-all">
                      <i class="fa-solid fa-floppy-disk text-amber-400"></i>
                      <span>저장하여 다음에 반영</span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          `;

          listContainer.appendChild(cardEl);
        }
      });
    }

    // -------------------------------------------------------------
    // 6. 인터랙션 및 상태 저장 함수들
    // -------------------------------------------------------------
    function toggleCard(cardId) {
      if (expandedCardId === cardId) {
        expandedCardId = null;
      } else {
        expandedCardId = cardId;
      }
      renderScheduleForDay(selectedWeekday);
    }

    function toggleTaskCheck(checkKey) {
      memoryCheckedBoxes[checkKey] = !memoryCheckedBoxes[checkKey];
      // 다시 그려서 취소선 스타일 즉각 반영
      renderScheduleForDay(selectedWeekday);
    }

    function saveElderNote(elderId, cardId) {
      const textarea = document.getElementById(`note-input-${elderId}`);
      if (!textarea) return;

      const noteText = textarea.value.trim();
      memoryNotes[elderId] = noteText;

      showToast('메모가 저장되어 다음 방문 시 확인하실 수 있습니다! 📝');
      renderScheduleForDay(selectedWeekday);
    }

    function showToast(message) {
      const toast = document.getElementById('toast-modal');
      const textEl = document.getElementById('toast-message');
      textEl.textContent = message;
      
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function escapeHtml(string) {
      return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 앱 시작
    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
