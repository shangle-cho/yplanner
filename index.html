        extend: {

          colors: {
            cozy: {
              cream: '#FFFDF9',
              card: '#FFF8F0',

          },
          keyframes: {
            gentlePulse: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.03)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            }
          },
          animation: {
            'gentle-pulse': 'gentlePulse 2s infinite ease-in-out',
            'float': 'float 3s infinite ease-in-out',

        }

  <style>

<body class="min-h-screen flex items-center justify-center p-4 text-cozy-brown font-sans antialiased selection:bg-cozy-peach">

  <!-- Main Container -->
  <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-cozy-peach/50 p-6 sm:p-8 flex flex-col items-center relative overflow-hidden transition-all duration-300">
    
    <!-- Decorative background elements -->
    <div class="absolute -top-12 -right-12 w-36 h-36 bg-cozy-peach/40 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-cozy-mint/50 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Header Section -->
    <header class="w-full text-center mb-5 z-10">
      <div class="flex items-center justify-center mb-2">
        <div class="inline-flex items-center gap-2 bg-amber-100/80 px-3.5 py-1.5 rounded-full text-xs font-bold text-amber-800 tracking-wide animate-float shadow-sm">
          <span>🍅 익살맞은 토마토 친구가 응원해요!</span>
        </div>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-cozy-brown flex items-center justify-center gap-2">
        <span>초단기 틈새 타이머</span>
        <span class="text-2xl inline-block hover:rotate-12 transition-transform">🍅</span>
      </h1>
      <p id="motivationalMsg" class="text-sm text-cozy-muted mt-1.5 transition-opacity duration-300">
        딴생각 나도 괜찮아요. 딱 한 문제만 보고 덮어요!
      </p>
    </header>

    <!-- Quick Preset Buttons -->
    <section class="w-full mb-6 z-10" aria-label="시간 프리셋 선택">
      <div class="grid grid-cols-4 gap-2">
        <button onclick="setTimer(3)" class="preset-btn py-2.5 px-1 rounded-2xl bg-cozy-card border border-cozy-peach/60 text-xs font-bold text-cozy-muted hover:bg-cozy-peach/50 hover:text-cozy-brown transition-all duration-200 active:scale-95 flex flex-col items-center">
          <span class="text-base mb-0.5">🌱</span>
          <span>3분 힐링</span>
        </button>
        <button onclick="setTimer(5)" class="preset-btn py-2.5 px-1 rounded-2xl bg-cozy-card border border-cozy-peach/60 text-xs font-bold text-cozy-muted hover:bg-cozy-peach/50 hover:text-cozy-brown transition-all duration-200 active:scale-95 flex flex-col items-center">
          <span class="text-base mb-0.5">☕</span>
          <span>5분 시작</span>
        </button>
        <button onclick="setTimer(10)" class="preset-btn active-preset py-2.5 px-1 rounded-2xl bg-cozy-coral text-white border border-cozy-coral shadow-md shadow-cozy-coral/30 text-xs font-bold transition-all duration-200 active:scale-95 flex flex-col items-center">
          <span class="text-base mb-0.5">⭐</span>
          <span>10분 집중</span>
        </button>
        <button onclick="setTimer(15)" class="preset-btn py-2.5 px-1 rounded-2xl bg-cozy-card border border-cozy-peach/60 text-xs font-bold text-cozy-muted hover:bg-cozy-peach/50 hover:text-cozy-brown transition-all duration-200 active:scale-95 flex flex-col items-center">
          <span class="text-base mb-0.5">🎯</span>
          <span>15분 완성</span>
        </button>
      </div>
    </section>

    <!-- Circular Timer Display -->
    <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-1 z-10">
      <svg class="w-full h-full transform" viewBox="0 0 260 260">
        <!-- Background Track -->
        <circle
          cx="130"
          cy="130"
          r="108"
          stroke="#F3E9DF"
          stroke-width="14"
          fill="transparent"
          stroke-linecap="round"
        />
        <!-- Active Progress Ring -->
        <circle
          id="progressCircle"
          class="progress-ring__circle"
          cx="130"
          cy="130"
          r="108"
          stroke="#F7A389"
          stroke-width="14"
          fill="transparent"
          stroke-linecap="round"
          stroke-dasharray="678.58"
          stroke-dashoffset="0"
        />
      </svg>

      <!-- Center Countdown & Status -->
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center select-none pointer-events-none">
        <span id="sessionTag" class="text-xs uppercase tracking-widest font-semibold text-cozy-coral bg-cozy-card px-2.5 py-1 rounded-full border border-cozy-peach/50 mb-1">
          컴활 10분 챌린지
        </span>
        <div id="timeDisplay" class="text-5xl sm:text-6xl font-extrabold tracking-tighter text-cozy-brown drop-shadow-sm font-mono">
          10:00
        </div>
        <div id="statusDot" class="flex items-center gap-1.5 mt-2 text-xs font-medium text-cozy-muted">
          <span class="w-2.5 h-2.5 rounded-full bg-cozy-sage/80 animate-ping"></span>
          <span id="statusText">준비 완료! 가볍게 시작해요</span>
        </div>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="w-full flex items-center justify-center gap-3 mt-5 z-10">
      <!-- Reset Button -->
      <button 
        id="resetBtn" 
        onclick="resetTimer()" 
        title="초기화"
        class="w-14 h-14 rounded-2xl bg-cozy-card hover:bg-cozy-peach/60 border border-cozy-peach/80 text-cozy-muted hover:text-cozy-brown flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <!-- Main Play/Pause Button -->
      <button 
        id="toggleBtn" 
        onclick="toggleTimer()" 
        class="flex-1 max-w-[200px] h-14 rounded-2xl bg-cozy-coral hover:bg-cozy-coralHover text-white font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-cozy-coral/30 transition-all duration-200 active:scale-95"
      >
        <span id="toggleIcon">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
        <span id="toggleText">시작하기</span>
      </button>

      <!-- Soft Sound Toggle -->
      <button 
        id="soundBtn" 
        onclick="toggleSound()" 
        title="알림음 켜기/끄기"
        class="w-14 h-14 rounded-2xl bg-cozy-card hover:bg-cozy-peach/60 border border-cozy-peach/80 text-cozy-muted hover:text-cozy-brown flex items-center justify-center transition-all duration-200 active:scale-90 shadow-sm"
      >
        <span id="soundIcon" class="text-xl">🔔</span>
      </button>
    </div>

    <!-- Completed Counter Footnote -->
    <div class="mt-7 w-full border-t border-cozy-peach/40 pt-4 flex items-center justify-between text-xs text-cozy-muted z-10 px-1">
      <div class="flex items-center gap-1.5">
        <span>오늘 채운 조각:</span>
        <span id="completedCount" class="font-bold text-cozy-coral text-sm">0회</span>
      </div>
      <button onclick="addMinute(1)" class="text-cozy-coral hover:underline font-semibold flex items-center gap-1">
        <span>+1분 더하기</span>
      </button>
    </div>

  </main>

  <script>
    // State variables
    let totalSeconds = 10 * 60;
    let remainingSeconds = 10 * 60;
    let timerId = null;
    let isRunning = false;
    let soundEnabled = true;
    let completedSessions = 0;

    // Encouraging messages pool
    const messages = [
      "딴생각 나도 괜찮아요. 딱 한 문제만 보고 덮어요!",
      "5분이면 충분해요. 시작한 것만으로도 대단한 일!",
      "가볍게 훑어보기만 해도 뇌에 차곡차곡 쌓여요.",
      "길게 안 해도 돼요. 딱 이 페이지만 읽고 쉬어요!",
      "오늘의 10분이 내일의 자격증을 만들어요 ⭐"
    ];

    // DOM Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const toggleBtn = document.getElementById('toggleBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const toggleText = document.getElementById('toggleText');
    const progressCircle = document.getElementById('progressCircle');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const motivationalMsg = document.getElementById('motivationalMsg');
    const completedCount = document.getElementById('completedCount');
    const sessionTag = document.getElementById('sessionTag');
    const soundIcon = document.getElementById('soundIcon');
    const presetButtons = document.querySelectorAll('.preset-btn');

    // Circumference of 108 radius circle = 2 * PI * 108 ≈ 678.58
    const CIRCUMFERENCE = 678.58;
    progressCircle.style.strokeDasharray = CIRCUMFERENCE;

    // Tone.js Synth for gentle chime
    let synth = null;

    function initTone() {
      if (!synth) {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: {
              attack: 0.05,
              decay: 0.2,
              sustain: 0.2,
              release: 1.2
            }
          }).toDestination();
          synth.volume.value = -6;
        } catch(e) {
          console.log("Audio not allowed yet");
        }
      }
    }

    // Play completion chime
    function playChime() {
      if (!soundEnabled) return;
      initTone();
      try {
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        const now = Tone.now();
        synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n", now);
        synth.triggerAttackRelease(["G5", "C6"], "4n", now + 0.3);
      } catch(e) {
        console.log(e);
      }
    }

    // Play soft tick/click on start
    function playStartTone() {
      if (!soundEnabled) return;
      initTone();
      try {
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        synth.triggerAttackRelease("G4", "16n");
      } catch(e) {}
    }

    // Format seconds to mm:ss
    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Update Progress Ring & Display
    function updateDisplay() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      const fraction = remainingSeconds / totalSeconds;
      const offset = CIRCUMFERENCE * (1 - fraction);
      progressCircle.style.strokeDashoffset = offset;
    }

    // Toggle Start / Pause
    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      playStartTone();
      isRunning = true;
      toggleText.textContent = "잠시 쉬기";
      toggleIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
      toggleBtn.classList.replace('bg-cozy-coral', 'bg-cozy-sage');
      toggleBtn.classList.replace('hover:bg-cozy-coralHover', 'hover:bg-cozy-sage/90');
      toggleBtn.classList.replace('shadow-cozy-coral/30', 'shadow-cozy-sage/30');

      statusText.textContent = "지금은 딱 1개에만 몰입하는 중 ✨";
      statusDot.firstElementChild.className = "w-2.5 h-2.5 rounded-full bg-cozy-coral animate-ping";

      timerId = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          completeTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerId);
      toggleText.textContent = "이어하기";
      toggleIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      toggleBtn.classList.replace('bg-cozy-sage', 'bg-cozy-coral');
      toggleBtn.classList.replace('hover:bg-cozy-sage/90', 'hover:bg-cozy-coralHover');
      toggleBtn.classList.replace('shadow-cozy-sage/30', 'shadow-cozy-coral/30');

      statusText.textContent = "잠시 숨 고르는 중 ☕";
      statusDot.firstElementChild.className = "w-2.5 h-2.5 rounded-full bg-cozy-muted";
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      toggleText.textContent = "시작하기";
      statusText.textContent = "준비 완료! 가볍게 시작해요";
      statusDot.firstElementChild.className = "w-2.5 h-2.5 rounded-full bg-cozy-sage/80 animate-ping";
      updateDisplay();
    }

    // When timer hits 00:00
    function completeTimer() {
      pauseTimer();
      completedSessions++;
      completedCount.textContent = `${completedSessions}회`;
      statusText.textContent = "오늘 분량 완벽 달성! 멋져요 🎉";
      
      // Fire festive warm confetti
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.65 },
          colors: ['#F7A389', '#FFE8D6', '#8BA888', '#FFD166']
        });
      }

      playChime();

      motivationalMsg.textContent = "정말 대단해요! 딱 이만큼이면 충분해요. 이제 홀가분하게 쉬세요!";
      motivationalMsg.classList.add('text-cozy-coral', 'font-bold');
      setTimeout(() => {
        motivationalMsg.classList.remove('text-cozy-coral', 'font-bold');
      }, 5000);
    }

    // Set duration from preset (minutes)
    function setTimer(minutes) {
      pauseTimer();
      totalSeconds = minutes * 60;
      remainingSeconds = totalSeconds;
      sessionTag.textContent = `컴활 ${minutes}분 챌린지`;

      // Cycle message randomly
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      motivationalMsg.textContent = randomMsg;

      // Update button active styles
      presetButtons.forEach(btn => {
        if (btn.textContent.includes(`${minutes}분`)) {
          btn.className = "preset-btn active-preset py-2.5 px-1 rounded-2xl bg-cozy-coral text-white border border-cozy-coral shadow-md shadow-cozy-coral/30 text-xs font-bold transition-all duration-200 active:scale-95 flex flex-col items-center";
        } else {
          btn.className = "preset-btn py-2.5 px-1 rounded-2xl bg-cozy-card border border-cozy-peach/60 text-xs font-bold text-cozy-muted hover:bg-cozy-peach/50 hover:text-cozy-brown transition-all duration-200 active:scale-95 flex flex-col items-center";
        }
      });

      resetTimer();
    }

    // Add +1 minute on the fly
    function addMinute(mins) {
      remainingSeconds += mins * 60;
      totalSeconds += mins * 60;
      updateDisplay();
    }

    // Toggle Sound On/Off
    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔔' : '🔕';
      if (soundEnabled) {
        initTone();
      }
    }

    // Start on window load
    window.onload = function() {
      updateDisplay();
    };
  </script>
</body>
</html>
